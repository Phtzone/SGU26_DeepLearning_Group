experiment:
  id: common_rate64_gru_grouped5fold_v1
  model: gru
  status: implemented
reference_run:
  experiment: common_rate64_cnn1d_grouped5fold_v1
  group_id: 20261123T072126Z_2c81daac
split:
  protocol: grouped_subject_wise_5fold
  manifest: splits/grouped_5fold_seed42.json
  split_seed: 42
data:
  source: common_rate
  processed_dir: data/processed/common_rate_64hz
  sampling_rate: 64
  window_seconds: 30
  stride_seconds: 15
  sensors: [chest_ACC, chest_ECG, chest_EMG, chest_EDA, chest_Temp, chest_Resp, wrist_ACC, wrist_BVP, wrist_EDA, wrist_TEMP]
  channels: [chest_ACC_X, chest_ACC_Y, chest_ACC_Z, chest_ECG, chest_EMG, chest_EDA, chest_Temp, chest_Resp, wrist_ACC_X, wrist_ACC_Y, wrist_ACC_Z, wrist_BVP, wrist_EDA, wrist_TEMP]
  labels: [1, 2, 3]
  quality_policy: all_samples_valid
  max_windows_per_subject: null
model:
  hidden_size: 64
  dropout: 0.3
training:
  seeds: [42]
  batch_size: 32
  max_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: weighted_cross_entropy
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
  gradient_clip_norm: 1.0
selection:
  metric: val_subject_macro_f1
  mode: max
  tie_breaker: val_loss
runtime:
  device: auto
  num_workers: 0
  deterministic: true
  parallel_folds: 1
  torch_threads: 2
tracking:
  backend: tensorboard
  strict: true
  tensorboard:
    enabled: true

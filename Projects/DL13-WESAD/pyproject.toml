[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl13-wesad"
version = "0.1.0"
description = "Reproducible subject-wise wearable stress recognition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2", "scikit-learn>=1.4", "PyYAML>=6", "matplotlib>=3.8", "psutil>=5.9", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=8"]
tracking = ["tensorboard>=2.21,<2.22"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
